<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#070014" />
		<meta name="application-name" content="AI Arcade" />
		<meta name="apple-mobile-web-app-title" content="AI Arcade" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="author" content="Christopher Miller" />
		<meta name="robots" content="index, follow" />

		<title>AI Arcade — play the house</title>
		<meta

		<meta property="og:type" content="website" />

		<meta
			property="og:description"
			content="Drop a coin. The machines are waiting. Each cabinet is its own world."
		/>
		<meta
			property="og:image"
			content="https://raw.githubusercontent.com/ChristopherLMiller/svelte-connect-4/main/static/og.png"
		/>
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1280" />
		<meta property="og:image:height" content="720" />
		<meta property="og:image:alt" content="AI Arcade marquee over live game cabinets." />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="AI Arcade — play the house" />
		<meta
			name="twitter:description"
			content="AI Arcade. Live cabinets. Each title is its own world, and the house thinks back."
		/>
		<meta
			name="twitter:image"
			content="https://raw.githubusercontent.com/ChristopherLMiller/svelte-connect-4/main/static/og.png"
		/>
		<meta name="twitter:image:alt" content="AI Arcade marquee over live game cabinets." />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<link rel="image_src" href="%sveltekit.assets%/og.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
