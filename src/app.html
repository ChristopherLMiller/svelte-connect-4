<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#07060d" />
		<meta name="application-name" content="Arcade Protocol" />
		<meta name="apple-mobile-web-app-title" content="Arcade Protocol" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="format-detection" content="telephone=no" />

		<title>Arcade Protocol — Game Launcher</title>
		<meta
			name="description"
			content="A flashy sci-fi arcade floor. Launch Connect 4 and more — gravity drops, bounce physics, shared volumes, and a living background score."
		/>
		<meta
			name="keywords"
			content="Arcade Protocol, Connect 4, Connect Four, arcade launcher, sci-fi, local multiplayer, minimax AI, web game"
		/>
		<meta name="author" content="Christopher Miller" />
		<meta name="robots" content="index, follow" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Arcade Protocol" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:title" content="Arcade Protocol — Game Launcher" />
		<meta
			property="og:description"
			content="Pick a cabinet. Dial the volumes. Launch Connect 4 and more from the Arcade Protocol floor."
		/>
		<meta
			property="og:image"
			content="https://raw.githubusercontent.com/ChristopherLMiller/svelte-connect-4/main/static/og.png"
		/>
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1280" />
		<meta property="og:image:height" content="720" />
		<meta
			property="og:image:alt"
			content="Arcade Protocol title screen: neon arcade branding over a starfield with crimson, gold, and cyan accents."
		/>

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Arcade Protocol — Game Launcher" />
		<meta
			name="twitter:description"
			content="A flashy sci-fi arcade floor with Connect 4, shared volumes, and a living background score."
		/>
		<meta
			name="twitter:image"
			content="https://raw.githubusercontent.com/ChristopherLMiller/svelte-connect-4/main/static/og.png"
		/>
		<meta
			name="twitter:image:alt"
			content="Arcade Protocol title screen: neon arcade branding over a starfield with crimson, gold, and cyan accents."
		/>

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<link rel="image_src" href="%sveltekit.assets%/og.png" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Arcade Protocol",
				"alternateName": "Arcade Protocol Game Launcher",
				"description": "A flashy sci-fi arcade floor. Launch Connect 4 and more with shared volumes and a living background score.",
				"applicationCategory": "GameApplication",
				"operatingSystem": "Any",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
				"image": "https://raw.githubusercontent.com/ChristopherLMiller/svelte-connect-4/main/static/og.png",
				"author": { "@type": "Person", "name": "Christopher Miller" }
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
